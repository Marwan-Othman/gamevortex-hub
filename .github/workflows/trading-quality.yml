name: GameVortex Trading Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gamevortex_ci?schema=public

jobs:
  trading-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee trading-test-output.txt

      - name: Upload test output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trading-test-output-${{ github.run_id }}
          path: trading-test-output.txt
          retention-days: 3
