name: GameVortex Trading Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gamevortex_ci?schema=public

jobs:
  trading-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gamevortex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gamevortex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair package lock if stale
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "package-lock.json was stale and has been synchronized on the PR branch; continuing with the synchronized lockfile."

      - name: Stage 0 - npm ci
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Verify clean migration chain
        run: npm run db:deploy

      - name: Stage 0 - typecheck
        run: npm run typecheck

      - name: Stage 0 - test
        run: |
          set -o pipefail
          npm test 2>&1 | tee trading-test-output.txt

      - name: Stage 0 - build
        run: npm run build

      - name: Upload test output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trading-test-output-${{ github.run_id }}
          path: trading-test-output.txt
          retention-days: 3
