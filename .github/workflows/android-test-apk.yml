name: Build GameVortex Hub Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/android-test-apk
    paths:
      - "android-app/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: android-app
          arguments: :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVortex-Hub-Android-Test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
